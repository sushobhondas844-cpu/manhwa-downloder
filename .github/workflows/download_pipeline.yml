# Module 1: Event Triggers
# Function: Defines the schedule and manual dispatch events for the workflow.
name: Automated Manhwa Chapter Ingestion

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
# Module 2: Code Retrieval
# Function: Checks out the repository files into the runner environment.
      - name: Checkout Code Repository
        uses: actions/checkout@v4

# Module 3: Environment Setup
# Function: Installs the designated Python version and required libraries.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

# Module 4: Pipeline Execution
# Function: Injects the dual authentication secrets and executes the main process.
      - name: Execute Downloader Pipeline
        env:
          NEXUS_DRIVE_CREDS: ${{ secrets.NEXUS_DRIVE_CREDS }}
          DRIVE_OAUTH_TOKEN: ${{ secrets.DRIVE_OAUTH_TOKEN }}
        run: |
          python main_pipeline.py
