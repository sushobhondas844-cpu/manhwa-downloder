# Module 1: Event Triggers
# Description: Defines the schedule and manual dispatch events for the workflow.
name: Automated Manhwa Chapter Ingestion

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
# Module 2: Code Retrieval
# Description: Checks out the repository files into the runner environment.
      - name: Checkout Code Repository
        uses: actions/checkout@v4

# Module 3: Environment Setup
# Description: Installs Python and the required pip packages.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

# Module 4: Headless Browser Provisioning
# Description: Downloads the core Chromium browser system using the Python module runner.
      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

# Module 5: Pipeline Execution
# Description: Injects the dual authentication secrets and executes the main process.
      - name: Execute Downloader Pipeline
        env:
          NEXUS_DRIVE_CREDS: ${{ secrets.NEXUS_DRIVE_CREDS }}
          DRIVE_OAUTH_TOKEN: ${{ secrets.DRIVE_OAUTH_TOKEN }}
        run: |
          python main_pipeline.py
